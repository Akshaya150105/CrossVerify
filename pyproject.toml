[tool.poetry]
name = "crossverify"
version = "0.1.0"
description = "A multi-modal retrieval and provenance system for news archives"
authors = []
readme = "CrossVerify-Execution-Guide.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
torch = "*"
torchvision = "*"
transformers = "*"
sentence-transformers = "*"
faiss-cpu = "*"
rank-bm25 = "*"
fastapi = "*"
uvicorn = { extras = ["standard"], version = "*" }
streamlit = "*"
scikit-learn = "*"
nltk = "*"
keybert = "*"
grad-cam = "*"
wandb = "*"
pandas = "*"
numpy = "*"
pillow = "*"
tqdm = "*"
feedparser = "*"
ImageHash = "*"
requests = "*"
trafilatura = "*"
beautifulsoup4 = "*"
lxml = "*"
pytest = "*"
httpx = "*"
python-multipart = "*"
networkx = "*"
pyvis = "*"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
